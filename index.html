  <p class="sub">일간의 눈으로 바라본 당신의 사주 풍경 · 포인트에 마우스를 대보세요<br>입력은 <b style="color:#e8d5a0">년 → 월 → 일 → 시</b> 순서 (쓰던 대로) · 화면은 시주가 왼쪽에 표시됩니다</p>

<script>
// ── 복제 억제(완벽한 방지는 불가, 일반 사용자 억제용) ──
(function(){
  // 우클릭(컨텍스트 메뉴) 막기
  document.addEventListener('contextmenu',e=>e.preventDefault());
  // 이미지/요소 드래그 막기
  document.addEventListener('dragstart',e=>e.preventDefault());
  // 텍스트 선택 막기 (입력창 제외)
  document.addEventListener('selectstart',e=>{if(e.target&&e.target.id==='si')return;e.preventDefault();});
  // 소스보기/저장/개발자도구 단축키 억제
  document.addEventListener('keydown',e=>{
    const k=(e.key||'').toLowerCase();
    if(e.key==='F12'){e.preventDefault();return;}
    if((e.ctrlKey||e.metaKey)&&!e.altKey){
      if(k==='s'||k==='u'||k==='p'){e.preventDefault();return;}            // 저장·소스·인쇄
      if(e.shiftKey&&(k==='i'||k==='j'||k==='c')){e.preventDefault();return;} // 개발자도구
    }
  });
})();
</script>

<script>
// ============================================================
// 데이터
// ============================================================
const CG=[
  {h:'甲',k:'갑',o:'목',y:'양'},{h:'乙',k:'을',o:'목',y:'음'},
  {h:'丙',k:'병',o:'화',y:'양'},{h:'丁',k:'정',o:'화',y:'음'},
  {h:'戊',k:'무',o:'토',y:'양'},{h:'己',k:'기',o:'토',y:'음'},
  {h:'庚',k:'경',o:'금',y:'양'},{h:'辛',k:'신',o:'금',y:'음'},
  {h:'壬',k:'임',o:'수',y:'양'},{h:'癸',k:'계',o:'수',y:'음'},
];
const JJ=[
  {h:'子',k:'자',o:'수',y:'양'},{h:'丑',k:'축',o:'토',y:'음'},
  {h:'寅',k:'인',o:'목',y:'양'},{h:'卯',k:'묘',o:'목',y:'음'},
  {h:'辰',k:'진',o:'토',y:'양'},{h:'巳',k:'사',o:'화',y:'음'},
  {h:'午',k:'오',o:'화',y:'양'},{h:'未',k:'미',o:'토',y:'음'},
  {h:'申',k:'신',o:'금',y:'양'},{h:'酉',k:'유',o:'금',y:'음'},
  {h:'戌',k:'술',o:'토',y:'양'},{h:'亥',k:'해',o:'수',y:'음'},
];
const CM={},JM={};
CG.forEach((c,i)=>{CM[c.h]=i;CM[c.k]=i});
JJ.forEach((j,i)=>{JM[j.h]=i;JM[j.k]=i});
const ON={'목':'木','화':'火','토':'土','금':'金','수':'水'};
const OH={'목':145,'화':10,'토':45,'금':210,'수':225};

// 오행 상생상극
const GENERATE={'목':'화','화':'토','토':'금','금':'수','수':'목'}; // 내가 생하는
const CONTROL={'목':'토','화':'금','토':'수','금':'목','수':'화'};  // 내가 극하는
const CTRL_BY={'목':'금','화':'수','토':'목','금':'화','수':'토'}; // 나를 극하는
const GEN_BY={'목':'수','화':'목','토':'화','금':'토','수':'금'};  // 나를 생하는

// 일간별 은유적 정체성
const ILGAN_META={
  '甲':{name:'큰 나무',visual:'greatTree',baseHue:140},
  '乙':{name:'꽃과 덩굴',visual:'flower',baseHue:150},
  '丙':{name:'태양',visual:'sun',baseHue:15},
  '丁':{name:'촛불',visual:'candle',baseHue:25},
  '戊':{name:'큰 산',visual:'mountain',baseHue:35},
  '己':{name:'정원',visual:'garden',baseHue:45},
  '庚':{name:'바위/칼날',visual:'blade',baseHue:200},
  '辛':{name:'보석/이슬',visual:'jewel',baseHue:215},
  '壬':{name:'대해',visual:'ocean',baseHue:220},
  '癸':{name:'안개/이슬비',visual:'mist',baseHue:230},
};

function parse(s){
  s=s.replace(/[\s,·]/g,'');if(s.length!==8)return null;
  const r=[];
  for(let i=0;i<8;i+=2){
    if(!(s[i]in CM)||!(s[i+1]in JM))return null;
    r.push({cg:CG[CM[s[i]]],jj:JJ[JM[s[i+1]]]});
  }
  return r;
}

// ============================================================
// 십신 분석 + 간이 신강/신약
// ============================================================
function deepAnalyze(pillars){
  const ilgan=pillars[2].cg; // 일주 천간 = 나
  const myOh=ilgan.o;

  // 나머지 7글자의 오행 수집
  const others=[];
  pillars.forEach((pl,i)=>{
    if(i===2) others.push(pl.jj.o); // 일주는 지지만
    else { others.push(pl.cg.o); others.push(pl.jj.o); }
  });

  // 십신 분류
  const sipsin={bigeop:0,siksang:0,jaesung:0,gwansal:0,insung:0};
  const sipsinOh={
    bigeop:myOh,                    // 비겁: 같은 오행
    siksang:GENERATE[myOh],         // 식상: 내가 생하는
    jaesung:CONTROL[myOh],          // 재성: 내가 극하는
    gwansal:CTRL_BY[myOh],          // 관살: 나를 극하는
    insung:GEN_BY[myOh],            // 인성: 나를 생하는
  };

  others.forEach(oh=>{
    if(oh===sipsinOh.bigeop) sipsin.bigeop++;
    else if(oh===sipsinOh.siksang) sipsin.siksang++;
    else if(oh===sipsinOh.jaesung) sipsin.jaesung++;
    else if(oh===sipsinOh.gwansal) sipsin.gwansal++;
    else if(oh===sipsinOh.insung) sipsin.insung++;
  });

  // 간이 신강/신약: 비겁+인성 vs 식상+재성+관살
  const strong=sipsin.bigeop+sipsin.insung;
  const weak=sipsin.siksang+sipsin.jaesung+sipsin.gwansal;
  // 월지 득령 보정
  const wolji=pillars[1].jj.o;
  const wolBonus=(wolji===myOh||wolji===GEN_BY[myOh])?1:-1;
  const isStrong=(strong+wolBonus)>weak;
  const strengthScore=(strong+wolBonus-weak)/7; // -1~+1

  // 지배 십신 (가장 많은)
  const sorted=Object.entries(sipsin).sort((a,b)=>b[1]-a[1]);
  const dominant=sorted[0][0];
  const secondary=sorted[1][1]>0?sorted[1][0]:null;

  // 오행별 총 카운트
  const ohCount={'목':0,'화':0,'토':0,'금':0,'수':0};
  pillars.forEach(pl=>{ohCount[pl.cg.o]++;ohCount[pl.jj.o]++});

  return{ilgan,myOh,sipsin,sipsinOh,isStrong,strengthScore,dominant,secondary,ohCount};
}

// ============================================================
// 은유 장면 선택
// ============================================================
function selectLegacyMetaphor(info){
  const m=ILGAN_META[info.ilgan.h];
  const d=info.dominant, s=info.secondary;
  const strong=info.isStrong;

  // 은유 조합: 일간 정체성 + 지배 십신 + 신강/신약
  let name='',desc='',sceneType='',quote='';

  // === 관살(나를 극하는 것) 지배 ===
  if(d==='gwansal'){
    if(!strong){
      const threats={'목':'도끼','화':'폭풍우','토':'뿌리 뽑는 바람','금':'용광로','수':'가뭄'};
      name=`${threats[info.sipsinOh.gwansal]} 속 ${m.name}`;
      desc=`거센 ${ON[info.sipsinOh.gwansal]}의 기운이 ${m.name}을(를) 휘감습니다`;
      sceneType='threat_weak';
      quote='바람이 거셀수록 뿌리는 깊어진다';
    } else {
      name=`시련을 넘기는 ${m.name}`;
      desc=`강한 의지로 ${ON[info.sipsinOh.gwansal]}의 압박을 버텨냅니다`;
      sceneType='threat_strong';
      quote='시련은 나를 깎아 빛나게 하는 숫돌이다';
    }
  }
  // === 비겁(동료) 지배 ===
  else if(d==='bigeop'){
    if(strong){
      name=`수많은 ${m.name}의 세계`;
      desc=`같은 기운이 가득 차 넘칩니다`;
      sceneType='crowd_strong';
      quote='넘치는 기운은 스스로를 다스릴 때 비로소 빛난다';
    } else {
      name=`동료를 찾는 ${m.name}`;
      desc=`비슷한 존재들 사이에서 자리를 잡아갑니다`;
      sceneType='crowd_weak';
      quote='같은 빛끼리 모여야 어둠을 밝힌다';
    }
  }
  // === 식상(표현/생산) 지배 ===
  else if(d==='siksang'){
    if(strong){
      name=`피어나는 ${m.name}`;
      desc=`넘치는 기운이 ${ON[info.sipsinOh.siksang]}으로 흘러나갑니다`;
      sceneType='express_strong';
      quote='꽃은 피어남으로써 존재를 증명한다';
    } else {
      name=`기운을 쏟아내는 ${m.name}`;
      desc=`남은 힘을 다해 ${ON[info.sipsinOh.siksang]}을(를) 만들어냅니다`;
      sceneType='express_weak';
      quote='마지막 한 방울의 빛도 누군가의 길이 된다';
    }
  }
  // === 재성(내가 지배하는 것) 지배 ===
  else if(d==='jaesung'){
    if(strong){
      name=`${m.name} 아래 펼쳐진 세상`;
      desc=`${ON[info.sipsinOh.jaesung]}의 세계를 지배합니다`;
      sceneType='dominate_strong';
      quote='천하를 얻되 자신을 잃지 않는 것이 참된 힘이다';
    } else {
      name=`감당 못할 재물 속 ${m.name}`;
      desc=`너무 많은 ${ON[info.sipsinOh.jaesung]}에 파묻힙니다`;
      sceneType='dominate_weak';
      quote='가진 것이 많을수록 가벼워져야 한다';
    }
  }
  // === 인성(나를 키우는 것) 지배 ===
  else if(d==='insung'){
    if(strong){
      name=`보호받는 ${m.name}`;
      desc=`${ON[info.sipsinOh.insung]}의 자양분이 넘칩니다`;
      sceneType='nurture_strong';
      quote='은혜를 알되 기대지 않을 때 스스로 선다';
    } else {
      name=`어머니 품의 ${m.name}`;
      desc=`${ON[info.sipsinOh.insung]}이(가) 약한 ${m.name}을(를) 감싸줍니다`;
      sceneType='nurture_weak';
      quote='어둠 속에서도 나를 비추는 빛은 있다';
    }
  }

  // 보조 십신으로 부제 보강
  if(s&&s!==d&&info.sipsin[s]>0){
    const subNames={bigeop:'동료의 기운',siksang:'표현의 기운',jaesung:'재물의 기운',gwansal:'시련의 기운',insung:'보호의 기운'};
    desc+=`, ${subNames[s]}도 함께합니다`;
  }

  // ─── 문장에서 시각 키워드 추출 ───
  // 생성된 name/desc/quote를 스캔해 그림 오버레이를 결정한다.
  const txt = name+' '+desc+' '+(quote||'');
  const story = {
    storm:   /폭풍우|폭풍/.test(txt),
    rain:    /폭풍우|빗|비[^^]/.test(txt) || /비 /.test(txt+' '),
    lightning: /번개|뇌/.test(txt),
    darkClouds: /폭풍우|먹구름|구름/.test(txt),
    drought: /가뭄|갈증|사막/.test(txt),
    fire:    /용광로|불길|업화|불바다|화염/.test(txt),
    wind:    /바람|뿌리 뽑|휘감|휩쓸/.test(txt),
    axe:     /도끼|칼|베/.test(txt),
    flood:   /홍수|범람|넘쳐|파묻/.test(txt),
    bloom:   /피어나|만개|피어|꽃|쏟아내/.test(txt),
    crowd:   /수많은|가득|넘치|동료/.test(txt),
    nurture: /감싸|품|어머니|보호|자양/.test(txt),
    hero:    /시련|넘기|굳건|꺾이지|극복/.test(txt),
    dominate: /지배|펼쳐진|세상/.test(txt),
  };
  return{name,desc,sceneType,meta:m,info,quote,story};
}

function sceneFromV4(input){
const CG_OH={甲:'목',乙:'목',丙:'화',丁:'화',戊:'토',己:'토',庚:'금',辛:'금',壬:'수',癸:'수'};

const CG_KR2CH={갑:'甲',을:'乙',병:'丙',정:'丁',무:'戊',기:'己',경:'庚',신:'辛',임:'壬',계:'癸'};
const JJ_KR2CH={자:'子',축:'丑',인:'寅',묘:'卯',진:'辰',사:'巳',오:'午',미:'未',신:'申',유:'酉',술:'戌',해:'亥'};
const GEN={목:'화',화:'토',토:'금',금:'수',수:'목'},CTRL={목:'토',화:'금',토:'수',금:'목',수:'화'},CBY={목:'금',화:'수',토:'목',금:'화',수:'토'},GBY={목:'수',화:'목',토:'화',금:'토',수:'금'};

const ILGAN_T={甲:'곧고 진취적',乙:'유연·생활력',丙:'밝고 정열적',丁:'섬세·헌신적',戊:'중후·포용',己:'자상·실속',庚:'강직·결단',辛:'예민·완벽주의',壬:'지혜·포용',癸:'총명·감성적'};

const ILGAN_FORMS={

//   fg = 기신일 때 덮치는/짓누르는 전경 그림 키 / sup = 용신일 때 돕는 그림 키
const ELEMENT_EXPR={
  수:{용신:{expr:'단비·샘물',sup:'spring'},   기신:{expr:'거센 물살·홍수',fg:'flood'}},
  목:{용신:{expr:'땔감·새순',sup:'sprout'},   기신:{expr:'가시덤불',fg:'thorn'}},
  화:{용신:{expr:'온기·등불',sup:'warmth'},   기신:{expr:'들불·가뭄',fg:'wildfire'}},

/* ═══════════════════════════════════════════════════════════
   ③ 분석 — 8글자 → 사주 상태 (결정론)
   ═══════════════════════════════════════════════════════════ */
function analyze(input){
  const s=input.replace(/[\s,·.]/g,'');
  if(s.length!==8)return null;
  const P=[];
  for(let i=0;i<8;i+=2){
    const cg=(s[i] in CG_OH)?s[i]:CG_KR2CH[s[i]];
    const jj=(s[i+1] in JJ_OH)?s[i+1]:JJ_KR2CH[s[i+1]];
    if(!(cg in CG_OH)||!(jj in JJ_OH))return null;
    P.push([cg,jj]);
  }
  const ilgan=P[2][0], my=CG_OH[ilgan];
  const sip={비겁:0,식상:0,재성:0,관살:0,인성:0};
  const map={[my]:'비겁',[GEN[my]]:'식상',[CTRL[my]]:'재성',[CBY[my]]:'관살',[GBY[my]]:'인성'};
  P.forEach((p,i)=>{(i===2?[JJ_OH[p[1]]]:[CG_OH[p[0]],JJ_OH[p[1]]]).forEach(o=>sip[map[o]]++);});
  const wolji=JJ_OH[P[1][1]];
  const strong=sip.비겁+sip.인성+((wolji===my||wolji===GBY[my])?1:-1), weak=sip.식상+sip.재성+sip.관살;
  const isStrong=strong>weak;
  const strengthScore=Math.max(-1,Math.min(1,(strong-weak)/7));
  const ohc={목:0,화:0,토:0,금:0,수:0}; P.forEach(p=>{ohc[CG_OH[p[0]]]++;ohc[JJ_OH[p[1]]]++;});
  const dom=Object.entries(sip).sort((a,b)=>b[1]-a[1])[0][0];
  return {P,ilgan,my,sip,isStrong,strengthScore,ohc,dom,map,season:SEASON[P[1][1]],time:TIME[P[3][1]],woljiJJ:P[1][1],siJJ:P[3][1]};
}

/* ═══════════════════════════════════════════════════════════
   ④ 장면 명세 빌드 — 사주 상태 → scene spec
   ═══════════════════════════════════════════════════════════ */
function resolveForm(a){const f=ILGAN_FORMS[a.ilgan];for(const t of f.transforms)if(t.cond(a))return{form:t.form,name:t.name,transformed:true};return{form:f.base,name:f.name,transformed:false};}

function buildSpec(a){
  const yongSip=a.isStrong?['식상','재성','관살']:['인성','비겁'];
  const roleSip=oh=>a.map[oh];
  // 각 오행을 '요소'로 — 역할(십신) + 용/기신 + 강도
  const elements=OH_LIST.filter(oh=>a.ohc[oh]>0).map(oh=>({oh,sip:roleSip(oh),yong:yongSip.includes(roleSip(oh)),strength:a.ohc[oh]}));
  const giEls=elements.filter(e=>!e.yong && e.oh!==a.my).sort((x,y)=>y.strength-x.strength);
  const yongEls=elements.filter(e=>e.yong && e.oh!==a.my).sort((x,y)=>y.strength-x.strength);
  const domGi=giEls[0]||null;
  const subject=resolveForm(a);
  // 상태 판정
  let state='calm';
  if(subject.form==='buriedTree') state='crushed';
  else if(subject.form==='bonfire') state='thrive';
  else if(!a.isStrong && domGi && domGi.strength>=3) state='threatened';
  else if(a.isStrong && yongEls.length>0 && yongEls[0].strength>=2) state='thrive';
  const scale=1+a.strengthScore*0.25; // 신강 크게, 신약 작게
  // 무대
  const cold=a.ohc.수+a.ohc.금>a.ohc.화+a.ohc.목;
  const night=/밤|새벽|땅거미|해질녘/.test(a.time);
  const stormy=(domGi&&(domGi.oh==='수'||domGi.oh==='화')&&domGi.strength>=3&&state==='threatened');
  return {a,subject,state,scale,elements,giEls,yongEls,domGi,stage:{season:a.season,time:a.time,cold,night,stormy},palette:palette(a,{cold,night,stormy})};
}

function palette(a,st){
  let top,bot,horizon;
  if(st.stormy){top='#0b1220';bot='#26313f';horizon='#3a4656';}
  else if(st.night){top='#0a0e1e';bot='#1c2340';horizon='#33406a';}
  else if(a.time==='동틀녘'||a.time==='해질녘'){top='#241a44';bot='#c76a3e';horizon='#e0925a';}
  else{top=st.cold?'#2b4e72':'#2f6fb8';bot=st.cold?'#8fb0c8':'#bfe0f5';horizon=st.cold?'#a9c4d6':'#dceff8';}
  if(a.season==='겨울'&&!st.stormy)bot='#a9bccb';
  if(a.season==='가을'&&!st.stormy)bot='#d9b98a';
  return {top,bot,horizon,glow:OH_HEX[a.my],stormy:st.stormy,night:st.night};
}

function caption(spec){
  const {a,subject,state,domGi,yongEls}=spec;
  const f=subject.name;
  let name,desc,quote;
  if(subject.form==='bonfire'){name='장작을 만나 타오르는 모닥불';desc='木(목)의 장작이 불씨를 키워 크게 타오릅니다';quote='땔감을 만난 불은 세상을 밝힌다';}
  else if(subject.form==='buriedTree'){name='감당 못할 재물에 짓눌린 나무';desc=`재성(${ON[CTRL[a.my]]})이 축복이 아니라 짐이 되어 짓누릅니다 — 재다신약`;quote='감당 못할 재물은 축복이 아니라 짐이다';}
  else if(state==='threatened'&&domGi){const t=ELEMENT_EXPR[domGi.oh].기신.expr.split('·')[0];name=`${t} 속 ${f}`;desc=`감당 못할 ${ON[domGi.oh]}(${domGi.sip})이 ${f}을(를) 위협합니다 — 신약`;quote='바람이 거셀수록 뿌리는 깊어진다';}
  else if(state==='thrive'){name=`번영하는 ${f}`;desc=yongEls[0]?`${ON[yongEls[0].oh]}(${yongEls[0].sip})의 기운을 잘 다스립니다 — 신강`:'기운이 조화롭습니다 — 신강';quote='다스릴 수 있는 힘만이 참된 풍요다';}
  else{name=`고요한 ${f}`;desc='기운이 대체로 평탄합니다';quote='고요함 속에 길이 있다';}
  return {name,desc:desc+` · ${a.season} ${a.time} · 일간 ${a.ilgan}(${f}) · ${a.isStrong?'신강':'신약'} · ${ILGAN_T[a.ilgan]}`,quote,
    scene:sceneText(spec)};
}
function sceneText(spec){
  const {a,subject,state,domGi}=spec;
  const seasonP={봄:'새순 돋는 봄',여름:'한여름',가을:'서리 내린 가을',겨울:'한겨울'}[a.season];
  const around=subject.form==='bonfire'?'차가운 어둠을 밝히며':subject.form==='buriedTree'?'감당 못할 재물 더미에 짓눌려':
    state==='threatened'&&domGi?`밀려드는 ${ELEMENT_EXPR[domGi.oh].기신.expr.split('·')[0]} 속에서`:
    state==='thrive'?'넉넉한 기운 가운데':'고요한 대지 위로';
  const subj={tree:'한 그루 큰 나무가',buriedTree:'작은 나무가',flower:'여린 꽃과 덩굴이',sun:'붉은 해가',candle:'작은 촛불 하나가',bonfire:'장작 위 모닥불이',mountain:'묵직한 산이',garden:'너른 정원이',blade:'서슬 퍼런 칼날이',jewel:'맑은 보석이',ocean:'드넓은 바다가',mist:'뿌연 안개가'}[subject.form];
  const verb=state==='thrive'?'흔들림 없이 자리를 지킨다':state==='crushed'?'파묻혀 신음하면서도 숨을 잇는다':state==='threatened'?'가녀리게 흔들리지만 끝내 꺾이지 않는다':'묵묵히 제자리를 지킨다';
  return `${seasonP} ${a.time}, ${around} ${subj} ${verb}.`;
}

function col(r,g,b,sat,bri){
  bri=bri||1;const gr=r*.299+g*.587+b*.114;
  return[(gr+(r-gr)*sat)*bri,(gr+(g-gr)*sat)*bri,(gr+(b-gr)*sat)*bri];
}
function oSat(n){return n===0?0:Math.pow(n/7,.5)}
function oBri(n){return n===0?.2:.45+n/7*.55}
function hslToRgb(h,s,l){h/=360;s/=100;l/=100;let r,g,b;if(s===0){r=g=b=l}else{const f=(p2,q,t2)=>{if(t2<0)t2+=1;if(t2>1)t2-=1;if(t2<1/6)return p2+(q-p2)*6*t2;if(t2<1/2)return q;if(t2<2/3)return p2+(q-p2)*(2/3-t2)*6;return p2};const q=l<.5?l*(1+s):l+s-l*s;const p2=2*l-q;r=f(p2,q,h+1/3);g=f(p2,q,h);b=f(p2,q,h-1/3)}return[Math.round(r*255),Math.round(g*255),Math.round(b*255)]}

function startViz(){
  if(p5i)p5i.remove();
  const info=analysisInfo;
  const ss=info.sipsin;

  // 각 십신별 채도/명도 (오행 개수 기반)
  const E={};
  for(const k of['목','화','토','금','수']){
    E[k]={sat:oSat(info.ohCount[k]),bri:oBri(info.ohCount[k]),n:info.ohCount[k]};
  }
  // 일간 오행
  const myE=E[info.myOh];
  // 관살 오행
  const gwanOh=info.sipsinOh.gwansal;
  const gwanE=E[gwanOh];
  // 비겁 오행
  const biE=E[info.sipsinOh.bigeop];
  // 식상 오행
  const sikOh=info.sipsinOh.siksang;
  const sikE=E[sikOh];
  // 재성 오행
  const jaeOh=info.sipsinOh.jaesung;
  const jaeE=E[jaeOh];
  // 인성 오행
  const inOh=info.sipsinOh.insung;
  const inE=E[inOh];

  const meta=metaphor.meta;
  const sType=metaphor.sceneType;
  const isStrong=info.isStrong;
  const str=info.strengthScore; // -1~+1

  p5i=new p5(p=>{
    let W,H,t=0;
    let tc={x:0,y:0,on:false};
    let bursts=[];
    let particles=[];
    // ── 마우스 감도: "아주 신약/아주 신강"일 때만 반응. 그 사이는 평범(반응 없음) ──
    const sAbs=Math.abs(str);
    const extremeTouch=sAbs>=.5;                       // 아주 신약 또는 아주 신강
    const touchSense=extremeTouch?(str<0?2.2:.55):1;   // 아주신약=예민 / 아주신강=둔감 / 그외=보통
    const volatileSubj=str<=-.5;                       // 아주 신약만 건드리면 폭발
    let touchHeat=0,lastBoom=-999;

    function calliPush(s,x,y){
      const last=s.pts[s.pts.length-1];
      if(last&&Math.hypot(x-last.x,y-last.y)<5)return;
      s.pts.push({x,y});if(s.pts.length>480)s.pts.splice(1,1);
      if(s.pts.length===2) calliInitParts(s);
    }
    function calliInitParts(s){
      const n=s.cfg.sparkly?60:40;
      s.sparkParts=Array.from({length:n},(_,i)=>({
        t:(i/n)*Math.max(s.pts.length-1,1),spd:(.04+Math.random()*.1)*s.cfg.speedM,
        phase:Math.random()*Math.PI*2,amp:s.cfg.waveA*(.5+Math.random()),

    function calliPos(s,tt){
      const pts=s.pts,len=pts.length;
      if(!len)return{x:0,y:0};if(len===1)return pts[0];
      const i=Math.max(0,Math.min(Math.floor(tt),len-2));
      const f=tt-Math.floor(tt);
      return{x:pts[i].x+(pts[i+1].x-pts[i].x)*f,y:pts[i].y+(pts[i+1].y-pts[i].y)*f};
    }
    function calliNorm(s,tt){
      const pts=s.pts;if(pts.length<2)return{nx:0,ny:1};
      const i=Math.max(0,Math.min(Math.floor(tt),pts.length-2));
      const dx=pts[i+1].x-pts[i].x,dy=pts[i+1].y-pts[i].y,d=Math.hypot(dx,dy)||1;
      return{nx:-dy/d,ny:dx/d};
    }

    function skyG(t1,t2,t3,b1,b2,b3,sat,bri,ratio){
      const a=p.constrain(introAnim*1.5,0,1);p.noStroke();

      gr.addColorStop(0,`rgb(${top.map(v=>v*a).join(',')})`);gr.addColorStop(1,`rgb(${bot.map(v=>v*a).join(',')})`);
      ctx.save();ctx.fillStyle=gr;ctx.fillRect(0,0,W,H*ratio);ctx.restore();
    }
    function glow(x,y,sz,r,g,b,sat,bri,int){
      const a=p.constrain(introAnim*2-.3,0,1);
      p.blendMode(p.ADD);p.noStroke();
      for(let rad=sz*int;rad>sz*.3;rad-=3){
        const c=col(r,g,b,sat,bri);
        p.fill(c[0],c[1],c[2],p.map(rad,sz*int,sz*.3,0,3+sat*12)*a);
        p.ellipse(x,y,rad*2);

    }
    function circ(x,y,sz,r,g,b,sat,bri){

    function mt(cx,by,w,h,r,g,b,sat,bri){
      const a=p.constrain(introAnim*2-.4,0,1);const c=col(r,g,b,sat,bri);
      p.noStroke();p.fill(c[0],c[1],c[2],230*a);
      p.beginShape();p.vertex(cx-w*.55,by);
      p.bezierVertex(cx-w*.4,by-h*.4,cx-w*.12,by-h*.95,cx,by-h);

    function water(ty,r,g,b,sat,bri){

    }
    function wavesF(ty,r,g,b,sat,bri,amp,n){

        p.stroke(c[0],c[1],c[2],(40+sat*60)*a);p.strokeWeight(1+sat);p.beginShape();

    function stars2(n,sat,bri){
      const a=p.constrain(introAnim*1.2,0,1);p.noStroke();p.randomSeed(42);
      for(let i=0;i<n;i++){const sx=p.random(W),sy=p.random(H*.5);const tw=Math.sin(t*1.5+i*1.3)*.5+.5;

    function tree2(x,by,h,tSat,tBri,lSat,lBri,thick){
      const a=p.constrain(introAnim*2-.4,0,1);
      const tc2=col(190,50,30,tSat,tBri);

    function drawParts(hue,sat,bri){
      const a=p.constrain(introAnim*2-1,0,1);if(a<=0)return;

        if(pt.x<-20)pt.x=W+20;if(pt.x>W+20)pt.x=-20;if(pt.y<-20)pt.y=H+20;if(pt.y>H+20)pt.y=-20;
        if(tc.on){const d=Math.sqrt((tc.x-pt.x)**2+(tc.y-pt.y)**2)||1;const R=120*touchSense;if(d<R){const f=2*touchSense*(1+(1-d/R));pt.x+=(pt.x-tc.x)/d*f;pt.y+=(pt.y-tc.y)/d*f}}

    function drawBursts(){
      bursts=bursts.filter(b=>b.life>0);p.blendMode(p.ADD);p.noStroke();

        if(b.vx!==undefined){b.x+=b.vx;b.y+=b.vy;b.vy+=.1;b.life-=1.5;const a2=b.life/b.ml;
          p.fill(b.r,b.g,b.b,a2*b.int);p.circle(b.x,b.y,b.size*a2);
          p.fill(b.r,b.g,b.b,a2*b.int*.3);p.circle(b.x-b.vx,b.y-b.vy,b.size*a2*.5);return}

          p.fill(b.r,b.g,b.b,a2*b.int*.5);p.circle(b.x+Math.cos(ang)*pr,b.y+Math.sin(ang)*pr*.5,2+a2*3)}
      });p.blendMode(p.BLEND);

    // ══════════════════════════════════════════
    // 장면 그리기 — 일간 유형별 + 십신 환경
